<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversion Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#16181d;--panel:#1f232b;--panel2:#272c36;--ink:#e8e6df;--mute:#9aa0ab;--line:#394050;--acc:#e0b04a;--good:#6cc784;--bad:#e06c6c;--card:#f4ecd8;--cardink:#2b2418}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0 12px 0 0;color:var(--acc)}
nav button{background:none;border:0;color:var(--mute);padding:8px 14px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{padding:16px;max-width:1500px;margin:auto}
button,select,input,textarea{font:inherit}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--acc);color:#222;border-color:var(--acc);font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.bad{color:var(--bad)}
input,select,textarea{background:#12151a;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 7px}
input[type=number]{width:60px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.panel h2,.panel h3{margin:0 0 8px;font-size:15px}
.decklist .it{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer}
.decklist .it:hover,.decklist .it.sel{background:var(--panel2)}
.decklist .it .n{width:44px;color:var(--mute)}
.decklist .it.lv .nm{color:var(--acc);font-weight:600}
.decklist .it .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0;background:var(--panel2)}
.sub h4{margin:0 0 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.fr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.fr label{color:var(--mute);font-size:12px}
.ab-ed{border:1px solid var(--acc);border-radius:8px;padding:8px;margin:10px 0}
.muted{color:var(--mute)}
/* ---------- card face (Egyptian theme) ---------- */
:root{--sand:#ecd9ae;--gold:#c9962b;--lapis:#1f4e8c;--lapisd:#14305a;--turq:#1fa39a;--carn:#b8402f;--mal:#2f7d4f;--ink:#3a2a10}
.card{--tc:#1f4e8c;width:2.5in;height:3.5in;background:linear-gradient(165deg,#f4e6c0,#e3ca94);color:var(--ink);border:3px solid var(--gold);border-radius:18px;box-shadow:inset 0 0 0 2px #fff7,inset 0 0 0 5px #c9962b44;display:flex;flex-direction:column;overflow:hidden;font:600 8.5pt/1.2 Nunito,system-ui,sans-serif;position:relative}
.card .band{background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#000));color:#fff;padding:6px 8px 5px;display:flex;align-items:center;gap:6px;position:relative}
.card .zig{height:6px;background:linear-gradient(135deg,var(--tc) 25%,transparent 25%) -6px 0,linear-gradient(225deg,var(--tc) 25%,transparent 25%) -6px 0;background-size:12px 6px;flex:none}
.card .num{background:#f6e7bf;color:var(--ink);border:2px solid #3a2a10;border-radius:999px;padding:0 8px;font:700 9pt Cinzel,serif;box-shadow:inset 0 0 0 1px var(--gold);flex:none}
.card .nm{font:700 10.5pt/1.1 Cinzel,serif;flex:1;text-shadow:0 1px 1px #0006}
.card .tagrow{display:flex;gap:3px;flex:none}
.card .body{padding:2px 8px 4px;display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
.card .foot{height:6px;margin:0 10px 6px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 9px);opacity:.55;border-radius:3px;flex:none}
.card .stores{display:flex;gap:6px;flex-wrap:wrap}
.su{display:flex;align-items:center;gap:4px;background:#fff6;border:1px solid #c9962b88;border-radius:999px;padding:2px 8px 2px 3px}
.su .pips{display:flex;gap:2px;align-items:center;flex-wrap:wrap;max-width:1.2in}
.pip{width:8px;height:8px;border-radius:3px;border:1.5px solid var(--ink);background:transparent}
.pip.on{background:var(--ink)}
.su .amt{font-weight:800;font-size:8.5pt}
.ico{display:inline-flex;width:15px;height:15px;flex:none}
.ico svg{width:100%;height:100%;display:block}
.tok{position:relative;width:21px;height:21px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;color:#fff;box-shadow:inset 0 -2px 0 #0003,inset 0 0 0 1.5px #fff8,0 1px 2px #0004;flex:none;line-height:1}
.tok.gem{background:conic-gradient(#e0504a,#e0b04a,#4aa86a,#3a8fd0,#9a5ad0,#e0504a)}
.tok .n{position:absolute;right:-5px;bottom:-5px;min-width:12px;height:12px;border-radius:6px;background:#2a1d0a;color:#fff;font:800 8px/12px Nunito,sans-serif;text-align:center;padding:0 2px;box-shadow:0 0 0 1px #fff9}
.tg{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:7px;background:var(--tg,#555);color:#fff;font:800 9px/1 Nunito,sans-serif;padding:0 3px;box-shadow:inset 0 -2px 0 #0003,inset 0 0 0 1px #fff7;font-size:12px}
.tg.txt{font-size:8px;padding:0 5px}
.pill{--ibg:#fff;display:inline-flex;align-items:center;gap:3px;padding:2px 6px 2px 4px;border-radius:999px;border:1.5px solid;font-weight:800;font-size:8.5pt;white-space:nowrap}
.pill.cd{background:#dfe8f3;border-color:#1f4e8c88;color:#14305a}
.pill.co{background:#f7dcd5;border-color:#b8402f88;color:#7a2417}
.pill.ef{background:#d8ecd9;border-color:#2f7d4f88;color:#1c5a35}
.pill .cmp{font-weight:800}
.rule{display:flex;flex-direction:column;gap:3px}
.rg{display:flex;flex-wrap:wrap;gap:4px 5px;align-items:center}
.rg .arr{color:var(--ink);width:17px;height:17px}
.rg .qi{color:var(--lapis)}
.rg .mini{width:12px;height:12px}
.ab{background:#fffa;border:1.5px solid #c9962b66;border-radius:12px;padding:3px 6px 4px 7px;position:relative;text-align:left}
.ab::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:4px;border-radius:0 3px 3px 0;background:var(--mal)}
.ab.m::before{background:var(--carn)}
.ab .t{display:flex;align-items:center;gap:4px;font:700 7.5pt Cinzel,serif;margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em}
.ab .t .mk{width:13px;height:13px}
.ab.m .t .mk{color:var(--carn)}
.ab.o .t .mk{color:var(--mal)}
.ab .d{font-size:7.8pt;font-weight:600}
.abs{display:flex;flex-direction:column;gap:5px;flex:1}
.exmark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#3a2a10;opacity:.35}
.exmark .ico{width:90px;height:90px}
.card.level{--tc:#c9962b;background:radial-gradient(circle at 50% 0,#2f66b0,#14305a 70%);color:#f6e6b5;border-color:#e5b94a}
.card.level .band{background:linear-gradient(180deg,#f0cf70,#c9962b);color:#14305a}
.card.level .nm{text-shadow:none}
.card.level .num{background:#14305a;color:#f0cf70;border-color:#14305a}
.card.level .zig{background:linear-gradient(135deg,#c9962b 25%,transparent 25%) -6px 0,linear-gradient(225deg,#c9962b 25%,transparent 25%) -6px 0;background-size:12px 6px}
.card.level .panel2{background:#f4e6c0;color:var(--ink);border-radius:12px;padding:4px 7px;display:flex;flex-direction:column;gap:3px}
.card.level .lab{display:flex;align-items:center;gap:4px;font:700 7pt Cinzel,serif;text-transform:uppercase;letter-spacing:.04em}
.card.level .foot{background:repeating-linear-gradient(90deg,#f0cf70 0 6px,transparent 6px 9px)}
.card.level .goal{margin-top:auto;background:linear-gradient(180deg,#f0cf70,#c9962b);color:#14305a;border-radius:14px;padding:5px 8px;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 0 0 2px #fff6}
.card.level .goal .rg{background:#f4e6c0;border-radius:10px;padding:3px 5px}
.oop{display:inline-grid;place-items:center;width:24px;height:32px;border:2px dashed var(--ink);border-radius:5px;font:800 9pt Nunito,sans-serif}
.card.back{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2f66b0,#14305a 75%);border-color:#e5b94a;color:#f0cf70;text-align:center;gap:6px}
.card.back::before{content:"";position:absolute;inset:8px;border:2px solid #e5b94a88;border-radius:12px}
.card.back.level{background:radial-gradient(circle at 50% 40%,#f6dc88,#c9962b 75%);color:#14305a;border-color:#14305a}
.card.back.level::before{border-color:#14305a88}
.card.back .ico{width:1.4in;height:1.4in}
.card.back .bkt{font:700 9pt Cinzel,serif;letter-spacing:.25em}
.card.back .bks{font:700 7.5pt Cinzel,serif;letter-spacing:.35em}
/* ---------- play ---------- */
.board{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.slot{display:flex;flex-direction:column;gap:6px;position:relative}
.slot.hz{flex-direction:row;align-items:flex-start;gap:0}
.slot.hz>.card{z-index:2;box-shadow:inset 0 0 0 2px #fff7,inset 0 0 0 5px #c9962b44,3px 3px 10px #0008}
.card{transition:transform .25s,filter .25s}
.card.ex{filter:grayscale(.85) brightness(.8) sepia(.3);transform:rotate(7deg) scale(.96)}
.linkbadge{position:absolute;left:-8px;top:46%;z-index:5;background:var(--acc);color:#222;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 1px 4px #000a}
.linkbadge .ico{width:16px;height:16px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.tok.pop{animation:pop .45s ease-out}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #e0b04a00}50%{box-shadow:0 0 0 3px #e0b04acc}}
.card .abtn{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.card button.ab:disabled{opacity:.5;cursor:not-allowed;filter:saturate(.5)}
.card button.ab:not(:disabled){animation:glow 2s infinite;border-color:var(--gold)}
.card button.ab:not(:disabled):hover{background:#fff}
.att{margin-left:-22px;padding-left:0;display:flex;gap:12px;align-items:flex-start}
.symrow{display:flex;gap:6px;align-items:center;margin:4px 0}
.symrow input[type=text]{width:56px;text-align:center}
.symrow input[type=color]{width:34px;height:26px;padding:0;border:0;background:none}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.stat div{background:var(--panel2);border-radius:6px;padding:4px 10px}
.pile{display:flex;flex-wrap:wrap;gap:6px}
.mini{background:var(--card);color:var(--cardink);border-radius:5px;padding:2px 7px;font-size:12px}
.mini.lv{background:#f1d98b}
.log{max-height:220px;overflow:auto;font-size:12px;color:var(--mute);background:#12151a;border-radius:6px;padding:6px 8px}
.log div{padding:1px 0}
.plusminus{display:inline-flex;gap:2px;margin-left:2px}
.plusminus button{border:0;background:#0003;color:inherit;border-radius:3px;cursor:pointer;line-height:1;padding:0 4px}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:16px;max-width:900px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.picks{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.alloc{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:center;margin:10px 0}
/* ---------- print ---------- */
#printArea .sheet{display:grid;grid-template-columns:repeat(3,2.5in);grid-auto-rows:3.5in;gap:0;width:7.5in;margin:0 auto 20px;background:#fff}
#printArea .sheet>*{outline:1px dashed #9a9a9a;outline-offset:-1px}
@media print{
  @page{margin:.25in}
  body{background:#fff}
  header,.noprint{display:none!important}
  main{padding:0;max-width:none}
  #printArea .sheet{margin:0;page-break-after:always;break-after:page}
  .card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <h1>◈ Conversion Deck</h1>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <label class="muted"><input type="checkbox" id="txt"> words instead of icons</label><span class="muted" id="saveNote"></span>
</header>
<main id="main"></main>
<datalist id="dl-tags"></datalist>
<datalist id="dl-res"></datalist>

<script>
"use strict";
/* ===================================================================
   Helpers
=================================================================== */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k==='class') e.className = v;
    else if (k==='style' && typeof v==='object') Object.assign(e.style, v);
    else if (k==='value') e.value = v;
    else e.setAttribute(k, v===true?'':v);
  }
  (function add(list){ for (const c of list){ if (c==null||c===false) continue; if (Array.isArray(c)) add(c); else e.append(c.nodeType?c:document.createTextNode(String(c))); } })(kids);
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const lc = s => String(s||'').trim().toLowerCase();
const OPS = {'<':(a,b)=>a<b,'<=':(a,b)=>a<=b,'=':(a,b)=>a===b,'>=':(a,b)=>a>=b,'>':(a,b)=>a>b};
const OPT = {'<':'fewer than','<=':'at most','=':'exactly','>=':'at least','>':'more than'};

/* ===================================================================
   Sample deck
=================================================================== */
function sampleDeck(){
  const A = (name, mandatory, conds, costs, effs) => ({name, mandatory, conds, costs, effs});
  const pay = (n,res,scope='any',tag='') => ({type:'pay',n,res,scope,tag});
  return {
    nextCard: 9, nextLevel: 3,
    cards: [
      {id:1,name:'Forest',tags:['Land'],stores:[{res:'wood',max:6}],abilities:[
        A('Chop',false,[],[{type:'exSelf'}],[{type:'gain',n:2,res:'wood',target:'self'}])]},
      {id:2,name:'Quarry',tags:['Land'],stores:[{res:'stone',max:4}],abilities:[
        A('Dig',false,[],[{type:'exSelf'}],[{type:'gain',n:1,res:'stone',target:'self'}])]},
      {id:3,name:'Sawmill',tags:['Building'],stores:[{res:'plank',max:4}],abilities:[
        A('Saw',false,[],[{type:'exSelf'},pay(2,'wood')],[{type:'gain',n:1,res:'plank',target:'self'}]),
        A('Fast Saw',false,[{type:'hasAtt'}],[{type:'exSelf'},pay(2,'wood')],[{type:'gain',n:2,res:'plank',target:'self'}])]},
      {id:4,name:'Campfire',tags:['Land'],stores:[],abilities:[
        A('Stoke',false,[],[pay(1,'wood')],[{type:'ready',rmode:'card',tag:'Land',res:''}])]},
      {id:5,name:'Mason',tags:['Building'],stores:[{res:'brick',max:3}],abilities:[
        A('Fire Bricks',false,[],[{type:'exSelf'},pay(2,'stone')],[{type:'gain',n:1,res:'brick',target:'self'}])]},
      {id:6,name:'Compost Heap',tags:['Land'],stores:[{res:'compost',max:3}],abilities:[
        A('Rot',true,[{type:'resCount',res:'wood',op:'>',n:4}],[pay(1,'wood')],[{type:'gain',n:1,res:'compost',target:'self'}])]},
      {id:7,name:'Hammer',tags:['Tool'],stores:[],abilities:[
        A('Equip',false,[],[{type:'exSelf'}],[{type:'attach',src:'self',srcTag:'',dst:'tag',dstTag:'Building'}])]},
      {id:8,name:'Foreman',tags:['Tool'],stores:[],abilities:[
        A('Inspire',false,[{type:'isReady'}],[{type:'exSelf'}],[{type:'ready',rmode:'card',tag:'Building',res:''}])]},
    ],
    levels: [
      {id:1,name:'First Shelter',tags:['Land','Building'],outOfPlay:[3],
        bringConds:[],bringCosts:[pay(2,'wood')],goalCosts:[pay(2,'plank')]},
      {id:2,name:'The Village',tags:['Land','Building','Tool'],outOfPlay:[7],
        bringConds:[{type:'resCount',res:'plank',op:'>',n:0}],bringCosts:[pay(1,'plank')],
        goalCosts:[pay(2,'brick'),pay(2,'plank'),{type:'exCard',tag:'Tool',res:'',n:1}]},
    ],
    meta:{resEmoji:{wood:'🪵',stone:'🪨',plank:'📏',brick:'🧱',compost:'🌱'},resColor:{},tagEmoji:{land:'🌴',building:'🏛️',tool:'🛠️'},tagColor:{land:'#2f7d4f',building:'#1f4e8c',tool:'#b8402f'}},
    order: ['c:1','c:2','c:3','l:1','c:4','c:5','c:6','l:2','c:7','c:8']
  };
}
/* the order above has c:7/c:8 after level 2 on purpose: they unlock after finishing level 2 and
   can't be used there. Level 2 therefore needs Hammer earlier — fix by moving them before l:2 */
function fixSample(d){ d.order=['c:1','c:2','c:3','l:1','c:4','c:5','c:6','c:7','c:8','l:2']; return d; }

/* ===================================================================
   Persistence
=================================================================== */
let deck, G;
function loadAll(){
  try { deck = JSON.parse(localStorage.getItem('cd.deck.v1')); } catch(e){}
  if (!deck || !deck.cards) deck = fixSample(sampleDeck());
  if (!deck.meta) deck.meta = sampleDeck().meta;
  const hm = deck.cards.find(c=>c.id===7);
  if (hm && hm.name==='Hammer' && !hm.abilities.length) hm.abilities = sampleDeck().cards[6].abilities; // starter migration
  try { G = JSON.parse(localStorage.getItem('cd.game.v1')); } catch(e){}
  if (!G || !G.phase) G = newGame();
}
function saveAll(){
  try { localStorage.setItem('cd.deck.v1', JSON.stringify(deck)); localStorage.setItem('cd.game.v1', JSON.stringify(G)); $('#saveNote').textContent='saved'; }
  catch(e){ $('#saveNote').textContent='(not saving)'; }
}
const cardDef = id => deck.cards.find(c=>c.id===id);
const levelDef = id => deck.levels.find(l=>l.id===id);
function refreshLists(){
  const tags=new Set(), res=new Set();
  deck.cards.forEach(c=>{ c.tags.forEach(t=>tags.add(t)); c.stores.forEach(s=>res.add(s.res)); });
  deck.levels.forEach(l=>l.tags.forEach(t=>tags.add(t)));
  $('#dl-tags').replaceChildren(...[...tags].filter(Boolean).map(t=>h('option',{value:t})));
  $('#dl-res').replaceChildren(...[...res].filter(Boolean).map(t=>h('option',{value:t})), h('option',{value:'*'}));
}

/* ===================================================================
   Text rendering of rules
=================================================================== */
const resName = r => (!r||r==='*') ? 'any resource' : r;
const SCOPE_T = {self:'this card',any:'cards in play',tag:'cards in play with',att:'cards attached',atttag:'attached cards with'};
function condText(c){
  const v=`${OPT[c.op]} ${c.n}`;
  switch(c.type){
    case 'tagCount': return `${v} [${c.tag||'?'}] cards in play`;
    case 'resCount': return `${v} ${c.res||'?'} in play`;
    case 'selfRes': return `this card has ${v} ${c.res||'?'}`;
    case 'isReady': return 'this card is ready';
    case 'isExhausted': return 'this card is exhausted';
    case 'hasAtt': return 'a card is attached to this card';
    case 'attTag': return `${v} [${c.tag||'?'}] among attached cards`;
    case 'attRes': return `${v} ${c.res||'?'} on attached cards`;
  } return '?';
}
function filtText(c, verb){
  return `${c.tag?` with [${c.tag}]`:''}${c.res?` holding ${c.n} ${c.res}`:''}`;
}
function costText(c){
  switch(c.type){
    case 'pay': { const sc=SCOPE_T[c.scope]||''; return `Pay ${c.n} ${resName(c.res)} from ${sc}${(c.scope==='tag'||c.scope==='atttag')?` [${c.tag||'?'}]`:''}`; }
    case 'exSelf': return 'Exhaust this card';
    case 'exCard': return `Exhaust a card${filtText(c)}`;
    case 'detach': return `Detach a card${filtText(c)}`;
  } return '?';
}
function effText(e){
  switch(e.type){
    case 'gain':
      if (e.target==='self') return `Gain ${e.n} ${e.res||'?'} on this card`;
      if (e.target==='tag') return `Gain ${e.n} ${e.res||'?'} on a [${e.tag||'?'}] card`;
      return `Gain ${e.n} ${e.res||'?'} (divide freely among your cards)`;
    case 'attach': {
      const src=e.src==='self'?'this card':e.src==='out'?`an out-of-play card${e.srcTag?` with [${e.srcTag}]`:''}`:`a card${e.srcTag?` with [${e.srcTag}]`:''}`;
      const dst=e.dst==='self'?'this card':`a card${e.dstTag?` with [${e.dstTag}]`:''}`;
      return `Attach ${src} to ${dst}`; }

function newGame(){ return {phase:'draw', pos:0, unlocked:[], level:null, inPlay:[], outPlay:[], done:[], nextIid:1, log:['New game. Draw cards until you reach a level.']}; }
const attachedOf = (S,host) => host ? S.inPlay.filter(c=>c.parent===host.iid) : [];

const hasTag = (inst,t) => tagsOf(inst).includes(lc(t));
const storeDef = (inst,res) => cardDef(inst.num).stores.find(s=>lc(s.res)===lc(res));

const ins = (S,iid) => S.inPlay.find(c=>c.iid===iid) || S.outPlay.find(c=>c.iid===iid);

function evalCond(S,c,host){
  switch(c.type){
    case 'tagCount': return OPS[c.op](S.inPlay.filter(i=>hasTag(i,c.tag)).length, +c.n);
    case 'resCount': return OPS[c.op](S.inPlay.reduce((a,i)=>a+amt(i,c.res),0), +c.n);
    case 'selfRes': return !!host && OPS[c.op](amt(host,c.res), +c.n);
    case 'isReady': return !!host && host.ready;
    case 'isExhausted': return !!host && !host.ready;
    case 'hasAtt': return attachedOf(S,host).length>0;
    case 'attTag': return !!host && OPS[c.op](attachedOf(S,host).filter(i=>hasTag(i,c.tag)).length, +c.n);
    case 'attRes': return !!host && OPS[c.op](attachedOf(S,host).reduce((a,i)=>a+amt(i,c.res),0), +c.n);
  } return false;
}
const condsOK = (S,conds,host) => conds.every(c=>evalCond(S,c,host));

function matchFilter(i,f){ return (!f.tag||hasTag(i,f.tag)) && (!f.res||amt(i,f.res)>=Math.max(1,+f.n||1)); }

  while(grew){ grew=false; for(const c of S.inPlay) if(c.parent&&kill.includes(c.parent)&&!kill.includes(c.iid)){kill.push(c.iid);grew=true;} }
  for(const iid of kill){
    const i=S.inPlay.find(c=>c.iid===iid); S.inPlay=S.inPlay.filter(c=>c.iid!==iid);
    i.parent=null; i.ready=true; Object.keys(i.res).forEach(k=>i.res[k]=0); S.outPlay.push(i);

const label = (S,i) => `#${i.num} ${cardDef(i.num).name}`;

/* ask requests: {kind:'pick',title,cands:[inst],avoid} -> inst

function* payCost(S,c,host,log){
  switch(c.type){
    case 'exSelf':
      if(!host||!host.ready) return false; host.ready=false; log.push(`exhaust ${label(S,host)}`); return true;
    case 'pay': {
      const n=+c.n||0; if(n<=0) return true;
      let src;
      if(c.scope==='self') src=host?[host]:[];
      else if(c.scope==='any') src=S.inPlay;
      else if(c.scope==='tag') src=S.inPlay.filter(i=>hasTag(i,c.tag));
      else if(c.scope==='att') src=attachedOf(S,host);
      else src=attachedOf(S,host).filter(i=>hasTag(i,c.tag));
      const items=[];
      for(const i of src){
        if(!c.res||c.res==='*'){ for(const [k,v] of Object.entries(i.res)) if(v>0) items.push({inst:i,res:k,max:v}); }
        else { const v=amt(i,c.res); if(v>0) items.push({inst:i,res:resKey(i,c.res),max:v}); }
      }
      const tot=items.reduce((a,x)=>a+x.max,0); if(tot<n) return false;
      let take;
      if(tot===n) take=items.map(x=>x.max);
      else if(items.length===1) take=[n];
      else take=yield {kind:'alloc',title:`Pay ${n} ${resName(c.res)}`,items,total:n};
      items.forEach((x,k)=>{ if(take[k]) { x.inst.res[x.res]-=take[k]; log.push(`pay ${take[k]} ${x.res} from ${label(S,x.inst)}`);} });
      return true;
    }
    case 'exCard': {
      const cands=S.inPlay.filter(i=>i.ready&&matchFilter(i,c)); if(!cands.length) return false;
      const t=cands.length===1?cands[0]:yield {kind:'pick',title:'Exhaust which card?',cands,avoid:host&&host.iid};
      t.ready=false; log.push(`exhaust ${label(S,t)}`); return true;
    }
    case 'detach': {
      const pool=host?attachedOf(S,host):S.inPlay.filter(i=>i.parent);
      const cands=pool.filter(i=>matchFilter(i,c)); if(!cands.length) return false;
      const t=cands.length===1?cands[0]:yield {kind:'pick',title:'Detach which card?',cands};

    if(e.target==='tag'){
      const cands=S.inPlay.filter(i=>hasTag(i,e.tag)&&storeDef(i,e.res)&&room(i,e.res)>0);
      if(!cands.length){ log.push(`no [${e.tag}] card could store ${e.res}`); return; }
      const t=cands.length===1?cands[0]:yield {kind:'pick',title:`Gain ${n} ${e.res} on which card?`,cands};
      log.push(`+${addRes(t,e.res,n)} ${e.res} on ${label(S,t)}`); return;
    }
    const items=S.inPlay.filter(i=>storeDef(i,e.res)&&room(i,e.res)>0).map(i=>({inst:i,res:resKey(i,e.res),max:Math.min(room(i,e.res),n)}));

    const dsts=dstFor(src);

    src.parent=dst.iid; log.push(`attach ${label(S,src)} to ${label(S,dst)}`);
  } else if(e.type==='ready'){
    if(e.rmode==='self'){ if(host){ host.ready=true; log.push(`ready ${label(S,host)}`);} return; }
    const cands=S.inPlay.filter(i=>!i.ready&&matchFilter(i,{tag:e.tag,res:e.res,n:1}));
    if(!cands.length){ log.push('no exhausted card to ready'); return; }
    const t=cands.length===1?cands[0]:yield {kind:'pick',title:'Ready which card?',cands};
    t.ready=true; log.push(`ready ${label(S,t)}`);
  }
}
function* activate(S,ab,host,log){
  if(!condsOK(S,ab.conds,host)) return false;
  const costs=[...ab.costs].sort((a,b)=>(a.type==='exSelf'?0:1)-(b.type==='exSelf'?0:1));
  for(const c of costs){ if(!(yield* payCost(S,c,host,log))) return false; }
  for(const e of ab.effs) yield* applyEffect(S,e,host,log);
  return true;
}
function* levelCosts(S,conds,costs,log){
  if(!condsOK(S,conds,null)) return false;
  for(const c of costs){ if(c.type==='exSelf') continue; if(!(yield* payCost(S,c,null,log))) return false; }
  return true;
}
/* drivers */
function autoAnswer(r){
  if(r.kind==='pick') return r.cands.find(c=>c.iid!==r.avoid)||r.cands[0];
  let left=r.total; return r.items.map(x=>{ const k=Math.min(x.max,left); left-=k; return k; });
}
function runSync(gen){ let r=gen.next(); while(!r.done) r=gen.next(autoAnswer(r.value)); return r.value; }
async function runAsync(gen,noCancel){ let r=gen.next(); while(!r.done){ r=gen.next(await askUser(r.value,noCancel)); } return r.value; }
function dry(fn){ const S=clone(G); return runSync(fn(S,[])); }

const canUse = (host,i) => G.phase==='level' && dry((S,l)=>activate(S,cardDef(host.num).abilities[i],ins(S,host.iid),l));

/* ===================================================================
   Game actions
=================================================================== */
let history=[];
async function act(fn){
  const snap=JSON.stringify(G); history.push(snap); if(history.length>60) history.shift();
  try { await fn(); }
  catch(e){ G=JSON.parse(snap); history.pop(); if(e!=='cancel') console.error(e); }
  saveAll(); render();
}
function undo(){ if(!history.length) return; G=JSON.parse(history.pop()); saveAll(); render(); }
const say = (...m) => { G.log.push(...m); if(G.log.length>300) G.log.splice(0,G.log.length-300); };

async function useAbility(host,i){
  const ab=cardDef(host.num).abilities[i];
  await act(async()=>{
    const log=[]; const ok=await runAsync(activate(G,ab,ins(G,host.iid),log));
    if(!ok) throw 'cancel';
    say(`▶ ${label(G,host)}: ${ab.name} — ${log.join('; ')}`);
    await settle();
  });
}
async function settle(){
  if(G.phase!=='level') return;
  for(let guard=0; guard<80; guard++){
    let fired=false;
    for(const host of [...G.inPlay]){
      const d=cardDef(host.num);
      for(let i=0;i<d.abilities.length;i++){
        const ab=d.abilities[i]; if(!ab.mandatory) continue;
        if(dry((S,l)=>activate(S,ab,ins(S,host.iid),l))){
          const log=[]; await runAsync(activate(G,ab,ins(G,host.iid),log),true);
          say(`⚙ ${label(G,host)}: ${ab.name} (mandatory) — ${log.join('; ')}`);
          fired=true; break;
        }
      }
      if(fired) break;
    }
    if(!fired) return;
  }
  say('⚠ Mandatory abilities kept firing (stopped after 80 resolutions).');
}
function drawOne(){
  const it=parseOrder(deck.order[G.pos]); G.pos++;
  if(it.k==='c'){ G.unlocked.push(it.id); say(`Unlocked #${it.id} ${cardDef(it.id).name}`); return false; }
  G.level=it.id; G.phase='levelready'; say(`Reached level ${it.id}: ${levelDef(it.id).name}`); return true;
}
function drawUntilLevel(){ return act(async()=>{
  if(G.pos>=deck.order.length){ G.phase='won'; return; }
  while(G.pos<deck.order.length){ if(drawOne()) return; }
  G.phase='won'; say('The deck is exhausted — you win!');
}); }
function drawSingle(){ return act(async()=>{ if(G.pos<deck.order.length) drawOne(); }); }
function beginLevel(){ return act(async()=>{
  const L=levelDef(G.level); const tags=L.tags.map(lc);
  G.inPlay=[]; G.outPlay=[];
  for(const num of G.unlocked){
    if(!cardDef(num).tags.some(t=>tags.includes(lc(t)))) continue;
    const i=makeInst(G,num);
    (L.outOfPlay.includes(num)?G.outPlay:G.inPlay).push(i);
  }
  G.phase='level'; say(`Level started: ${L.name}. ${G.inPlay.length} cards in play, ${G.outPlay.length} out of play.`);
  await settle();
}); }
function bringIn(inst){ return act(async()=>{
  const L=levelDef(G.level); const log=[];
  const ok=await runAsync(levelCosts(G,L.bringConds,L.bringCosts,log));
  if(!ok){ say('Cannot bring that card into play.'); throw 'cancel'; }
  const host=null;
  const real=ins(G,inst.iid); G.outPlay=G.outPlay.filter(c=>c.iid!==inst.iid);
  real.parent=host?host.iid:null; real.ready=true; G.inPlay.push(real);
  say(`➕ ${label(G,real)} enters play${host?' attached to '+label(G,host):''}${log.length?' — '+log.join('; '):''}`);
  await settle();
}); }
function completeLevel(){ return act(async()=>{
  const L=levelDef(G.level); const log=[];
  const ok=await runAsync(levelCosts(G,[],L.goalCosts,log));
  if(!ok) throw 'cancel';
  say(`🏆 Completed ${L.name}! ${log.join('; ')}`);
  G.done.push(L.id); G.inPlay=[]; G.outPlay=[]; G.level=null;
  G.phase = G.pos>=deck.order.length ? 'won' : 'draw';
  if(G.phase==='won') say('The deck is exhausted — you win!');
}); }
function restartLevel(){ if(confirm('Restart this level from its setup?')) act(async()=>{ G.phase='levelready'; G.inPlay=[]; G.outPlay=[]; say('Level reset.'); }); }
function newRun(){ if(confirm('Start a new run? Current progress is lost.')){ G=newGame(); history=[]; saveAll(); render(); } }
function manualAdjust(inst,res,d){ act(async()=>{ const i=ins(G,inst.iid);
  if(d>0) addRes(i,res,d); else i.res[res]=Math.max(0,(i.res[res]||0)+d);
  await settle(); }); }

function askUser(req,noCancel){ return new Promise((resolve,reject)=>{
  const close=()=>ov.remove();
  const cancel = noCancel ? null : h('button',{class:'btn',onclick:()=>{close();reject('cancel');}},'Cancel');
  let body;
  if(req.kind==='pick'){
    body=h('div',{}, h('h3',{},req.title), h('div',{class:'picks'},
      req.extra?h('button',{class:'btn pri',onclick:()=>{close();resolve('none');}},req.extra):null,
      req.cands.map(c=>h('button',{class:'btn',style:{textAlign:'left'},onclick:()=>{close();resolve(c);}},
        h('b',{},label(G,c)), ' ', h('span',{class:'muted'},
          Object.entries(c.res).filter(([,v])=>v>0).map(([k,v])=>`${k}:${v}`).join(' ')+(c.ready?'':' (exhausted)'))))),
      cancel);
  } else {
    const vals=autoAnswer(req); const inputs=[];
    const sum=()=>inputs.reduce((a,x)=>a+(+x.value||0),0);
    const status=h('span',{});
    const ok=h('button',{class:'btn pri',onclick:()=>{close();resolve(inputs.map(x=>+x.value||0));}},'Confirm');
    const upd=()=>{ const s=sum(); status.textContent=`${s} / ${req.total}`; ok.disabled=s!==req.total; };
    const grid=h('div',{class:'alloc'});
    req.items.forEach((x,k)=>{
      const inp=h('input',{type:'number',min:0,max:x.max,value:vals[k],oninput:upd}); inputs.push(inp);
      grid.append(h('span',{},label(G,x.inst)), resChip(x.res,`${x.res} (up to ${x.max})`), inp);
    });
    body=h('div',{}, h('h3',{},req.title), grid, h('div',{class:'row'},ok,cancel,status)); upd();
  }
  const ov=h('div',{class:'ov'}, h('div',{class:'modal'},body)); document.body.append(ov);
}); }

const COND_T = {
  tagCount:['Cards in play with tag',['tag','op','n']],
  resCount:['Resource in play',['res','op','n']],
  selfRes:['This card has resource',['res','op','n']],
  isReady:['This card is ready',[]],
  isExhausted:['This card is exhausted',[]],
  hasAtt:['A card is attached to this card',[]],
  attTag:['Attached cards with tag',['tag','op','n']],
  attRes:['Attached cards have resource',['res','op','n']],
};
const COST_T = {
  pay:['Pay resource',['n','res','scope','tag']],
  exSelf:['Exhaust this card',[]],
  exCard:['Exhaust a card (filters optional)',['tag','res','n']],
  detach:['Detach a card (filters optional)',['tag','res','n']],
};
const EFF_T = {
  gain:['Gain resource',['n','res','target','tag']],
  ready:['Ready a card',['rmode','tag','res']],
  attach:['Attach a card',['src','srcTag','dst','dstTag']],
};
const SELECTS = {
  op:[['<','fewer than'],['<=','at most'],['=','exactly'],['>=','at least'],['>','more than']],
  scope:[['self','this card'],['any','any cards in play'],['tag','cards in play with tag'],['att','cards attached to this'],['atttag','attached cards with tag']],
  target:[['free','divide among cards'],['self','this card'],['tag','a card with tag']],
  rmode:[['self','this card'],['card','a card…']],
  src:[['self','this card'],['tag','a card in play (tag optional)'],['out','an out-of-play card (tag optional)']],
  dst:[['self','this card'],['tag','a card in play (tag optional)']],
};
const FIELD_LABEL = {tag:'tag',res:'resource',n:'#',op:'',scope:'from',target:'on',rmode:''};
const DEFAULTS = {src:'self',dst:'tag',srcTag:'',dstTag:'',tag:'',res:'',op:'>=',n:1,scope:'any',target:'free',rmode:'card'};
function visible(o,f){
  if(f==='tag'){ if(o.type==='pay') return o.scope==='tag'||o.scope==='atttag'; if(o.type==='gain') return o.target==='tag'; return true; }
  if(f==='srcTag') return o.src!=='self';
  if(f==='dstTag') return o.dst==='tag';
  if(f==='n' && (o.type==='exCard'||o.type==='detach')) return true;
  return true;
}
function mkRow(T,type){ const o={type}; for(const f of T[type][1]) o[f]=DEFAULTS[f]; if(type==='gain') o.target='self'; if(type==='ready') o.rmode='card'; if(type==='attach'){o.src='self';o.dst='tag';} return o; }

function rowsEditor(arr,T,opts,onStruct){
  const box=h('div',{});
  const allowed=opts.allowed||Object.keys(T);
  arr.forEach((o,idx)=>{
    const fr=h('div',{class:'fr'});
    const typeSel=h('select',{onchange:e=>{ arr[idx]=mkRow(T,e.target.value); onStruct(); }},
      allowed.map(k=>h('option',{value:k,selected:k===o.type},T[k][0])));
    fr.append(typeSel);
    for(const f of T[o.type][1]){
      if(!visible(o,f)) continue;
      if(f==='dst') fr.append(h('label',{},'to'));
      if(f==='scope' && opts.level){ /* limit scopes */ }
      if(SELECTS[f]){
        let optsList=SELECTS[f]; if(f==='scope'&&opts.level) optsList=optsList.filter(x=>x[0]==='any'||x[0]==='tag');
        fr.append(h('select',{onchange:e=>{o[f]=e.target.value;onStruct();}}, optsList.map(([v,t])=>h('option',{value:v,selected:v===o[f]},t))));
      } else if(f==='n'){
        fr.append(h('input',{type:'number',min:0,value:o.n,oninput:e=>o.n=+e.target.value}));
      } else {
        fr.append(h('input',{type:'text',placeholder:f==='res'&&(o.type==='pay')?'resource (* = any)':/tag/i.test(f)?'tag':f,list:/tag/i.test(f)?'dl-tags':'dl-res',value:o[f],size:12,oninput:e=>o[f]=e.target.value}));
      }
    }
    fr.append(h('button',{class:'btn sm bad',onclick:()=>{arr.splice(idx,1);onStruct();}},'✕'));
    box.append(fr);
  });
  box.append(h('button',{class:'btn sm',onclick:()=>{arr.push(mkRow(T,allowed[0]));onStruct();}},'+ '+opts.add));
  return box;
}
const sub = (title,...k) => h('div',{class:'sub'},h('h4',{},title),...k);

function tagInput(arr,onChange){

    }

      h('hr',{style:{borderColor:'var(--line)',margin:'12px 0'}}),
      h('div',{class:'row'},
        h('button',{class:'btn sm',onclick:exportJSON},'Export'),
        h('button',{class:'btn sm',onclick:importJSON},'Import'),
        h('button',{class:'btn sm bad',onclick:()=>{ if(confirm('Replace your deck with the starter deck?')){ deck=fixSample(sampleDeck()); G=newGame(); history=[]; ui.sel=null; saveAll(); render(); } }},'Reset to starter'))),
    h('div',{class:'panel'},right));
}

/* ===================================================================
   Print tab
=================================================================== */
function renderPrint(){
  const items=deck.order.map(parseOrder);
  const area=h('div',{id:'printArea'});
  for(let i=0;i<items.length;i+=9){
    const chunk=items.slice(i,i+9); while(chunk.length<9) chunk.push(null);
    area.append(h('div',{class:'sheet'},chunk.filter(Boolean).map(faceFor)));
    if(ui.backs){ // mirror each row so fronts and backs line up when printed double-sided (flip on long edge)
      const m=[]; for(let r=0;r<3;r++) m.push(chunk[r*3+2],chunk[r*3+1],chunk[r*3]);
      area.append(h('div',{class:'sheet'},m.map(it=>it?cardBack(it.k==='l'):h('div',{}))));
    }
  }
  return h('div',{},
    h('div',{class:'panel noprint',style:{marginBottom:'14px'}},
      h('div',{class:'row'},h('button',{class:'btn pri',onclick:()=>window.print()},'Print / Save PDF'),h('label',{},h('input',{type:'checkbox',checked:ui.backs,onchange:e=>{ui.backs=e.target.checked;render();}}),' include card backs (print double-sided, flip on long edge)'),
        h('span',{class:'muted'},`${items.length} cards, 9 per page, in deck order (page 1 first, top-left first). Print at 100% scale on Letter paper, then cut along the dashed lines. Stack them in print order: first printed on top.`))),
    area);
}

/* ===================================================================
   Play tab
=================================================================== */
function ctlFor(inst){
  return { can:i=>canUse(inst,i), use:i=>useAbility(inst,i), manual:ui.manual?(r,d)=>manualAdjust(inst,r,d):null };
}
function slotFor(inst){
  const d=cardDef(inst.num);
  const wrap=h('div',{class:'slot hz'}, cardFace(d,inst,ctlFor(inst)));
  if(inst.parent) wrap.append(h('span',{class:'linkbadge',title:'attached'},ico('attach')));
  const kids=G.inPlay.filter(c=>c.parent===inst.iid);
  if(kids.length) wrap.append(h('div',{class:'att'},kids.map(slotFor)));
  return wrap;
}
function renderPlay(){
  const root=h('div',{});
  const total=deck.order.length;
  root.append(h('div',{class:'stat'},
    h('div',{},`Deck: ${total-G.pos} left`), h('div',{},`Unlocked: ${G.unlocked.length}`), h('div',{},`Levels done: ${G.done.length}/${deck.levels.length}`),
    h('div',{class:'row'},
      h('button',{class:'btn sm',disabled:!history.length,onclick:undo},'↶ Undo'),
      h('button',{class:'btn sm bad',onclick:newRun},'New run'),
      G.phase==='level'?h('label',{class:'muted'},h('input',{type:'checkbox',checked:ui.manual,onchange:e=>{ui.manual=e.target.checked;render();}}),' manual ± resources'):null)));
  const main=h('div',{class:'panel'});
  const unlockedPile=()=>h('div',{style:{marginTop:'10px'}},h('div',{class:'muted'},'Unlocked pile'),
    h('div',{class:'pile'},G.unlocked.length?G.unlocked.map(n=>h('span',{class:'mini'},'#'+n+' '+cardDef(n).name)):h('span',{class:'muted'},'empty')));
  if(G.phase==='draw'){
    main.append(h('h2',{},'Draw phase'),h('p',{},'Reveal cards from the top of the deck into your unlocked pile until you hit a level card.'),
      h('div',{class:'row'},h('button',{class:'btn pri',onclick:drawUntilLevel},'Draw until level'),h('button',{class:'btn',onclick:drawSingle},'Draw one')),unlockedPile());
  } else if(G.phase==='levelready'){
    const L=levelDef(G.level);
    main.append(h('h2',{},'Level reached'),h('div',{class:'board'},levelFace(L),
      h('div',{style:{maxWidth:'420px'}},h('p',{},`Cards in your unlocked pile with tags ${L.tags.map(t=>`[${t}]`).join(' ')} will be set up. `+
        (L.outOfPlay.length?`Cards ${L.outOfPlay.map(n=>'#'+n).join(', ')} (if unlocked) start out of play.`:'All start in play.')),
        h('div',{class:'row'},h('button',{class:'btn pri',onclick:beginLevel},'Set up level'),h('button',{class:'btn',onclick:drawSingle,disabled:true,style:{display:'none'}}))),unlockedPile()));
  } else if(G.phase==='won'){
    main.append(h('h2',{},'🏆 You finished the deck!'),h('button',{class:'btn pri',onclick:()=>{G=newGame();history=[];saveAll();render();}},'Play again'));
  } else {
    const L=levelDef(G.level);
    const canWin=dry((S,l)=>levelCosts(S,[],L.goalCosts,l));
    main.append(h('div',{class:'row',style:{marginBottom:'10px'}},h('h2',{style:{margin:0}},`Level ${L.id}: ${L.name}`),
      h('button',{class:'btn pri',disabled:!canWin,onclick:completeLevel},'Complete level'),
      h('button',{class:'btn sm',onclick:restartLevel},'Restart level')),
      h('div',{class:'muted',style:{marginBottom:'10px'}},'To complete: '+(L.goalCosts.map(costText).join('; ')||'nothing')));
    main.append(h('div',{class:'board'}, G.inPlay.filter(c=>!c.parent).map(slotFor)));
    if(G.outPlay.length){
      const okBring = dry((S,l)=>levelCosts(S,L.bringConds,L.bringCosts,l));
      main.append(h('h3',{style:{marginTop:'18px'}},'Out of play'),
        h('div',{class:'muted',style:{marginBottom:'8px'}},'To bring one in: '+([L.bringConds.length?'if '+L.bringConds.map(condText).join('; '):'',L.bringCosts.map(costText).join('; ')].filter(Boolean).join(' — ')||'free')),
        h('div',{class:'board'},G.outPlay.map(i=>h('div',{class:'slot'},cardFace(cardDef(i.num)),
          h('button',{class:'btn',disabled:!okBring,onclick:()=>bringIn(i)},'Bring into play')))));
    }
  }
  root.append(main);
  root.append(h('div',{class:'panel',style:{marginTop:'14px'}},h('h3',{},'Log'),
    h('div',{class:'log',id:'log'},G.log.slice(-80).map(m=>h('div',{},m)))));
  root.append(h('details',{class:'panel',style:{marginTop:'14px'}},h('summary',{},'Rules'),h('div',{class:'muted'},
    h('p',{},'Draw cards from the top of the deck into the unlocked pile until you reach a level card. Set up the level: every unlocked card sharing a level tag goes in play, except the cards the level lists as out of play.'),
    h('p',{},'Resolve optional abilities in any order: pay the cost, then apply the effects. Mandatory abilities resolve instantly the moment their conditions and costs can be met. Gained resources that no card can store are lost; storage caps apply.'),
    h('p',{},'Cards are only attached when an effect says so. Attached cards count as in play. Detaching a card (and anything attached to it) returns it out of play, emptied and ready. Complete the level by paying its cost, then keep drawing.'))));
  return root;
}

/* ===================================================================
   Shell
=================================================================== */
function render(){
  refreshLists(); curVals={};
  const tabs=[['design','Design'],['print','Print'],['play','Play']];
  $('#nav').replaceChildren(...tabs.map(([k,t])=>h('button',{class:ui.tab===k?'on':'',onclick:()=>{ui.tab=k;try{localStorage.setItem('cd.tab',k)}catch(e){}render();}},t)));
  const main=$('#main');
  main.replaceChildren(ui.tab==='design'?renderDesign():ui.tab==='print'?renderPrint():renderPlay());
  const lg=$('#log'); if(lg) lg.scrollTop=lg.scrollHeight;
  prevVals=curVals; $('#txt').checked=ui.text;
}
loadAll();
$('#txt').addEventListener('change',e=>{ui.text=e.target.checked;try{localStorage.setItem('cd.text',ui.text?'1':'')}catch(_){} render();});
try{ui.text=!!localStorage.getItem('cd.text');}catch(e){}
try{ const t=localStorage.getItem('cd.tab'); if(t) ui.tab=t; }catch(e){}
render();
</script>
</body>
